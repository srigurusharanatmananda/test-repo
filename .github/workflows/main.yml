name: Daily Commit Report to ClickUp

on:
  schedule:
    # Runs at 12 AM UTC every day (adjust timezone as needed)
    # Format: minute hour day month weekday
    - cron: '0 0 * * *'
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pytz
      
      - name: Generate and send report
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python << 'EOF'
          import os
          import requests
          from datetime import datetime, timedelta
          import json
          from collections import defaultdict

          # Configuration
          GITHUB_TOKEN = os.environ['GITHUB_TOKEN']
          CLICKUP_TOKEN = os.environ['CLICKUP_API_TOKEN']
          CLICKUP_LIST_ID = os.environ['CLICKUP_LIST_ID']
          GITHUB_USERNAME = os.environ['GITHUB_USERNAME']
          
          # Your GitHub usernames to track commits from
          MY_GITHUB_USERNAMES = [
              GITHUB_USERNAME,
              'Sri Guru Sharanatmananda',
              'srigurusharanatmananda', 
              'srizacchaeus'
          ]
          # Convert to lowercase for case-insensitive matching
          MY_GITHUB_USERNAMES_LOWER = [u.lower() for u in MY_GITHUB_USERNAMES]

          # Calculate time range (last 24 hours)
          end_time = datetime.utcnow()
          start_time = end_time - timedelta(days=1)
          
          print(f"Fetching commits from {start_time.isoformat()} to {end_time.isoformat()}")

          # GitHub API headers
          github_headers = {
              'Authorization': f'token {GITHUB_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          # Fetch user's repositories and specific org repositories
          repos = []
          
          # Fetch personal repos (may fail with 403 in some contexts, that's ok)
          personal_repos_url = f'https://api.github.com/user/repos?affiliation=owner,collaborator&per_page=100'
          personal_response = requests.get(personal_repos_url, headers=github_headers)
          
          if personal_response.status_code == 200:
              personal_data = personal_response.json()
              if isinstance(personal_data, list):
                  repos.extend(personal_data)
                  print(f"✓ Fetched {len(personal_data)} personal repos")
              else:
                  print(f"⚠ Unexpected response format for personal repos: {personal_data}")
          else:
              print(f"⚠ Could not fetch personal repos: {personal_response.status_code} (this is OK if running in org context)")
          
          # Fetch repos from specific organizations with pagination
          org_names = ['kailasa-ngpt']  # Add more orgs here if needed
          
          for org in org_names:
              page = 1
              org_repos_count = 0
              
              while True:
                  org_repos_url = f'https://api.github.com/orgs/{org}/repos?per_page=100&page={page}'
                  org_response = requests.get(org_repos_url, headers=github_headers)
                  
                  if org_response.status_code == 200:
                      org_repos = org_response.json()
                      if isinstance(org_repos, list):
                          if len(org_repos) == 0:
                              break  # No more pages
                          repos.extend(org_repos)
                          org_repos_count += len(org_repos)
                          print(f"  → Fetched page {page}: {len(org_repos)} repos")
                          page += 1
                      else:
                          print(f"⚠ Unexpected response format from {org}: {org_repos}")
                          break
                  else:
                      print(f"⚠ Could not fetch repos from {org} (page {page}): {org_response.status_code}")
                      print(f"Response: {org_response.text}")
                      break
              
              print(f"✓ Fetched total of {org_repos_count} repos from {org}")
          
          # Remove duplicates (in case a repo appears in both lists)
          seen = set()
          unique_repos = []
          for repo in repos:
              if isinstance(repo, dict) and 'full_name' in repo:
                  if repo['full_name'] not in seen:
                      seen.add(repo['full_name'])
                      unique_repos.append(repo)
          
          repos = unique_repos
          print(f"Total repositories to scan: {len(repos)}")
          print(f"Repositories: {[r['full_name'] for r in repos[:10]]}")  # Show first 10

          # Collect commits by repository
          commits_by_repo = defaultdict(list)
          total_commits = 0

          for repo in repos:
              if not isinstance(repo, dict) or 'full_name' not in repo:
                  continue
                  
              repo_name = repo['full_name']
              
              # Fetch commits for this repo in the last 24 hours
              commits_url = f"https://api.github.com/repos/{repo_name}/commits"
              params = {
                  'since': start_time.isoformat() + 'Z',
                  'until': end_time.isoformat() + 'Z',
                  'per_page': 100
              }
              
              try:
                  commits_response = requests.get(commits_url, headers=github_headers, params=params)
                  
                  if commits_response.status_code != 200:
                      print(f"⚠ Could not fetch commits for {repo_name}: {commits_response.status_code}")
                      continue
                  
                  commits = commits_response.json()
                  
                  if not isinstance(commits, list):
                      print(f"⚠ Unexpected response format for {repo_name}: {type(commits)}")
                      continue
                  
                  print(f"  📊 Scanning {repo_name}: found {len(commits)} total commits in time range")
                  
                  if len(commits) > 0:
                      matched_count = 0
                      for commit in commits:
                          if not isinstance(commit, dict):
                              continue
                          
                          # Safely extract commit data
                          commit_info = commit.get('commit', {})
                          author_info = commit_info.get('author', {})
                          committer_info = commit_info.get('committer', {})
                          
                          # Get GitHub username from commit author
                          github_author = commit.get('author', {})
                          author_login = github_author.get('login', '') if github_author else ''
                          author_name = author_info.get('name', '')
                          author_email = author_info.get('email', '')
                          
                          # DEBUG: Print what we found
                          print(f"    🔍 Commit {commit.get('sha', '')[:7]}: login='{author_login}', name='{author_name}', email='{author_email}'")
                          
                          # Filter by your usernames - check both login and commit author name
                          author_match = False
                          if author_login and author_login.lower() in MY_GITHUB_USERNAMES_LOWER:
                              author_match = True
                              print(f"      ✅ MATCHED on login: {author_login}")
                          elif author_name and author_name.lower() in MY_GITHUB_USERNAMES_LOWER:
                              author_match = True
                              print(f"      ✅ MATCHED on name: {author_name}")
                          else:
                              print(f"      ❌ NO MATCH - Checking against: {MY_GITHUB_USERNAMES}")
                          
                          if not author_match:
                              continue
                          
                          commit_data = {
                              'message': commit_info.get('message', 'No message').split('\n')[0],  # First line only
                              'sha': commit.get('sha', 'unknown')[:7],  # Short SHA
                              'url': commit.get('html_url', ''),
                              'timestamp': author_info.get('date', ''),
                              'author': author_login or author_name or 'Unknown'
                          }
                          commits_by_repo[repo_name].append(commit_data)
                          total_commits += 1
                          matched_count += 1
                      
                      print(f"  ✓ {matched_count} commits matched your usernames in {repo_name}")
              except Exception as e:
                  print(f"❌ Error fetching commits for {repo_name}: {e}")
                  import traceback
                  traceback.print_exc()
                  continue

          # Build the report
          if total_commits == 0:
              report_content = f"# Daily Commit Report - {end_time.strftime('%Y-%m-%d')}\n\n"
              report_content += "No commits found in the last 24 hours.\n"
          else:
              report_content = f"# Daily Commit Report - {end_time.strftime('%Y-%m-%d')}\n\n"
              report_content += f"**Total commits: {total_commits}**\n\n"
              
              for repo_name in sorted(commits_by_repo.keys()):
                  commits = commits_by_repo[repo_name]
                  report_content += f"## 📦 {repo_name} ({len(commits)} commits)\n\n"
                  
                  for commit in commits:
                      author_display = f" by {commit['author']}" if commit.get('author') else ""
                      report_content += f"- `{commit['sha']}` {commit['message']}{author_display}\n"
                      report_content += f"  [View commit]({commit['url']})\n"
                  
                  report_content += "\n"

          print("Report generated:")
          print(report_content)

          # Send to ClickUp
          clickup_url = f'https://api.clickup.com/api/v2/list/{CLICKUP_LIST_ID}/task'
          clickup_headers = {
              'Authorization': CLICKUP_TOKEN,
              'Content-Type': 'application/json'
          }

          task_data = {
              'name': f'Daily Commit Report - {end_time.strftime("%Y-%m-%d")}',
              'description': report_content,
              'status': 'to do',
              'tags': ['daily-report', 'github-commits']
          }

          response = requests.post(clickup_url, headers=clickup_headers, json=task_data)
          
          if response.status_code in [200, 201]:
              print(f"✅ Successfully created task in ClickUp!")
              print(f"Task URL: {response.json().get('url', 'N/A')}")
          else:
              print(f"❌ Failed to create task in ClickUp: {response.status_code}")
              print(f"Response: {response.text}")
              exit(1)

          EOF
